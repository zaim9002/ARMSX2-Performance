name: ARMSX2 Performance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ARMSX2 APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Prepare shaderc
        run: |
          if [ -f ./platforms/android/shaderc/utils/git-sync-deps ]; then
            cd platforms/android/shaderc
            ./utils/git-sync-deps || true
          fi

      - name: Make Gradle executable
        run: chmod +x platforms/android/gradlew

      - name: Build APK
        working-directory: platforms/android
        run: ./gradlew assembleGithubRelease --no-daemon --stacktrace

      - name: Find APK
        run: |
          find platforms/android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-Performance-APK
          path: platforms/android/**/*.apk
          if-no-files-found: error
