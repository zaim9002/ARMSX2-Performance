name: ARMSX2 Performance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;28.2.13676358"
          sdkmanager "cmake;3.31.6"

      - name: Prepare
        run: |
          chmod +x platforms/android/gradlew
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          ./platforms/android/gradlew --version

      - name: Build APK
        working-directory: platforms/android
        run: |
          ./gradlew assembleGithubRelease --no-daemon --stacktrace

      - name: Find APK
        run: |
          find platforms/android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-Performance-APK
          path: platforms/android/**/*.apk
          if-no-files-found: error
